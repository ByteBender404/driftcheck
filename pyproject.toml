[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcheck"
version = "0.1.0"
description = "A Python CLI tool that detects statistical drift between two tabular datasets"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.0.0",
    "pyarrow>=10.0.0",
    "scipy>=1.7.0",
    "typer>=0.9.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
driftcheck = "driftcheck.cli:app"
